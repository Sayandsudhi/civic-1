services:
  - type: web
    name: civicpulse-app
    runtime: python
    plan: free
    region: oregon
    buildCommand: "chmod +x ./build.sh && ./build.sh"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civicpulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"

databases:
  - name: civicpulse-db
    plan: free
    region: oregon
    databaseName: civicpulse
    user: civicpulse_user
